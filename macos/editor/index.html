<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Note</title>
    <style>
      html, body, .noteText, .note-date {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      html, body { background: transparent; color: CanvasText; }
      .note-date {
        text-align: center;
        font-size: 11px;
        font-weight: 400;
        line-height: 14px;
      }
      .noteText { font-size: 13px; font-weight: 400; line-height: 16px; }
      .note-title, [data-note-title] {
        font-size: 22px;
        font-weight: 700;
        line-height: 26px;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
